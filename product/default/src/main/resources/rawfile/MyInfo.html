<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
          font-family: Arial, sans-serif;
          margin: 0;
          padding: 0;
          background-color: #f8f9fa;
        }

        header {
          background-color: #343a40;
          color: #fff;
          padding: 20px;
        }

        header h1 {
          margin: 0;
        }

        #avatar {
          width: 150px;
          height: 150px;
          border-radius: 50%;
          border: 5px solid #fff;
          margin: 20px auto;
          display: block;
        }

        #intro {
          padding: 20px;
          text-align: center;
        }

        #social-links {
          text-align: center;
          padding: 20px;
        }

        #social-links a {
          display: inline-block;
          margin: 0 10px;
          width: 120px;
          height: 40px;
          line-height: 40px;
          border-radius: 20px;
          text-decoration: none;
          transition: background-color 0.3s ease;
        }

        #social-links a.weibo {
          background-color: #e6162d;
          color: #fff;
        }

        #social-links a.weibo:hover {
          background-color: #c41123;
        }

        #social-links a.douyin {
          background-color: #69c9d0;
          color: #fff;
        }

        #social-links a.douyin:hover {
          background-color: #51a8af;
        }

        #social-links a.bilibili {
          background-color: #f56565;
          color: #fff;
        }

        #social-links a.bilibili:hover {
          background-color: #d44c4c;
        }

        #social-links a i {
          font-size: 20px;
          margin-right: 10px;
        }

        #social-links a span {
          font-size: 16px;
        }

        @media (max-width: 768px) {
          header h1 {
            font-size: 24px;
          }

          #avatar {
            width: 100px;
            height: 100px;
          }

          #social-links a {
            width: 80px;
            height: 30px;
            line-height: 30px;
            font-size: 14px;
          }

          #social-links a i {
            font-size: 16px;
            margin-right: 5px;
          }
        }
    </style>
</head>

<body>
<img id="avatar" src="../base/media/addoil_flower.svg" alt="个人头像">
<div id="intro">
    <p>这是关于我的简单介绍。</p>
</div>
<div id="social-links">
    <a href="https://space.bilibili.com/582268894" target="_blank" class="weibo">
        <i class="fab fa-weibo"></i><span>门二三三</span>
    </a>
    <a href="https://space.bilibili.com/582268894" target="_blank" class="douyin">
        <i class="fab fa-tiktok"></i><span>门二三三</span>
    </a>
    <a href="https://space.bilibili.com/582268894" target="_blank" class="bilibili">
        <i class="fab fa-bilibili"></i><span>门二三三</span>
    </a>
</div>
</body>

</html>
