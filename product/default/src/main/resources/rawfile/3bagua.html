<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .baguaBox {
            margin: 100px auto;
            width: 800px;
            height: 800px;
            /* background-color: #bfc; */
            position: relative;
            border-radius: 50%;
            overflow: hidden;
            box-sizing: border-box;
        }

        .baguaBox:hover {
            transform: rotateZ(720deg);
            transition: all 3s;
        }

        .yang {
            background-color: #fff;
        }

        .yin {
            background-color: #000;
        }

        .taiji {
            width: 30%;
            height: 30%;
            position: absolute;
            top: 35%;
            left: 35%;
            background-color: pink;
            border-radius: 50%;
            overflow: hidden;
        }

        .taiji>.yang {
            width: 50%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .taiji>.yin {
            width: 50%;
            height: 100%;
            position: absolute;
            right: 0;
            bottom: 0;
        }

        .taiji>.yangyang {
            width: 50%;
            height: 50%;
            position: absolute;
            top: 0;
            left: 25%;
            border-radius: 50%;
            background-color: #fff;
        }

        .taiji>.yinyin {
            width: 50%;
            height: 50%;
            position: absolute;
            right: 25%;
            bottom: 0;
            border-radius: 50%;
            background-color: #000;
        }

        .taiji>.yangyang>.yin {
            width: 20%;
            height: 20%;
            position: absolute;
            left: 40%;
            top: 40%;
            border-radius: 50%;
        }

        .taiji>.yinyin>.yang {
            width: 20%;
            height: 20%;
            position: absolute;
            left: 40%;
            top: 40%;
            border-radius: 50%;
        }

        .baguaBox>.gua {
            width: 800px;
            height: 800px;
            /* border: 1px dotted #f133f5; */
            border-radius: 50%;
            position: absolute;
            left: 0;
            top: 0;
        }

        .gua1 {
            transform: rotate(0deg);
        }

        .gua2 {
            transform: rotate(45deg);
        }

        .gua3 {
            transform: rotate(90deg);
        }

        .gua4 {
            transform: rotate(135deg);
        }

        .gua5 {
            transform: rotate(180deg);
        }

        .gua6 {
            transform: rotate(225deg);
        }

        .gua7 {
            transform: rotate(270deg);
        }

        .gua8 {
            transform: rotate(315deg);
        }

        .yaoBox {
            width: 18%;
            height: 20%;
            /* background-color: #ccc; */
            margin: 5% auto;
            box-sizing: border-box;
        }

        .yao {
            width: 100%;
            height: 20%;
            margin: 20% 0;
            background-color: #000;
        }
    </style>
</head>

<body>
    <div class="baguaBox">
        <!-- 太极 -->
        <div class="taiji">
            <div class="yang">
            </div>
            <div class="yin">
                <div class="yang"></div>
            </div>
            <div class="yangyang">
                <div class="yin"></div>
            </div>
            <div class="yinyin">
                <div class="yang"></div>
            </div>
        </div>
        <!-- 八卦 -->
        <div class="gua gua1">
            <div class="yaoBox">
                <div class="yao"></div>
                <div class="yao"></div>
                <div class="yao"></div>
            </div>
        </div>
        <div class="gua gua2">
            <div class="yaoBox">
                <div class="yao"></div>
                <div class="yao"></div>
                <div class="yao"></div>
            </div>
        </div>
        <div class="gua gua3">
            <div class="yaoBox">
                <div class="yao"></div>
                <div class="yao"></div>
                <div class="yao"></div>
            </div>
        </div>
        <div class="gua gua4">
            <div class="yaoBox">
                <div class="yao"></div>
                <div class="yao"></div>
                <div class="yao"></div>
            </div>
        </div>
        <div class="gua gua5">
            <div class="yaoBox">
                <div class="yao"></div>
                <div class="yao"></div>
                <div class="yao"></div>
            </div>
        </div>
        <div class="gua gua6">
            <div class="yaoBox">
                <div class="yao"></div>
                <div class="yao"></div>
                <div class="yao"></div>
            </div>
        </div>
        <div class="gua gua7">
            <div class="yaoBox">
                <div class="yao"></div>
                <div class="yao"></div>
                <div class="yao"></div>
            </div>
        </div>
        <div class="gua gua8">
            <div class="yaoBox">
                <div class="yao"></div>
                <div class="yao"></div>
                <div class="yao"></div>
            </div>
        </div>
    </div>
</body>

</html>
